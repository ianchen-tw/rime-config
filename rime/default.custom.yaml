patch:
    schema_list:
      - schema: bopomofo_tw
    style/horizontal: true
    ascii_composer:
      good_old_caps_lock: false # good_old_caps_lock: 傳統 capslock 的大小寫功能
      switch_key:
        Caps_Lock: clear  # 清除未上屏內容，然後切換到英文
    switches:                   # 注意縮進
      - name: ascii_mode
        reset: 0                # reset 0 的作用是當從其他輸入方案切換到本方案時，
        states: [ 中文, 英文 ]  # 重設爲指定的狀態，而不保留在前一個方案中設定的狀態。
      - name: full_shape        # 選擇輸入方案後通常需要立即輸入中文，故重設 ascii_mode = 0；
        reset: 0
        states: [ 半角 ]  # 而全／半角則可沿用之前方案中的用法。